name: "Godot Build (Riot) — Android APK"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.3"

jobs:
  import-check:
    name: "استيراد المشروع وفحص الأخطاء"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project (headless) and fail on script/scene errors
        run: |
          godot --headless --verbose --editor --quit 2>&1 | tee import.log
          if grep -qi "ERROR:" import.log; then
            echo "::error::Godot reported errors while importing the project."
            grep -i "ERROR:" import.log
            exit 1
          fi

  export-android-apk:
    name: "تصدير APK (Android Debug)"
    needs: import-check
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project (populate .godot cache)
        run: godot --headless --verbose --editor --quit

      - name: Install Android Gradle build template (manual — CLI flag hangs headless in 4.3)
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          touch android/.gdignore

      - name: Export Android debug APK
        run: |
          mkdir -v -p build/android
          timeout 600 godot --headless --verbose --export-debug "Android" build/android/riot-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riot-debug-apk
          path: build/android/riot-debug.apk
          retention-days: 14
